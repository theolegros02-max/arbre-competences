<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Compétences - Théo Legros</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --color-a: #ef4444; /* Nord / Rouge - Pilotage ACM Expert */
            --color-b: #3b82f6; /* Est / Bleu - Formation RH & Directeur BAFA/BAFD */
            --color-c: #10b981; /* Sud / Vert - Pédagogie, Youth & IA Pédagogique */
            --color-d: #a855f7; /* Ouest / Violet - Anglais: Agrégation & CAPES */
            --locked-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
            position: relative;
        }

        #galaxy-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0b1120 80%);
            pointer-events: none;
        }

        .star {
            position: absolute; background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #3b82f6); }
        }

        #world {
            position: absolute; top: 0; left: 0; width: 9000px; height: 9000px;
            transform-origin: 0 0; cursor: grab; z-index: 1;
        }

        #world:active { cursor: grabbing; }

        #svg-canvas {
            width: 9000px; height: 9000px;
            position: absolute; top: 0; left: 0;
            pointer-events: none;
        }

        .connection-line {
            stroke: var(--locked-color);
            stroke-width: 3px;
            transition: stroke 0.3s ease;
        }

        .connection-line.active-a { stroke: var(--color-a); stroke-width: 4px; filter: drop-shadow(0 0 8px var(--color-a)); }
        .connection-line.active-b { stroke: var(--color-b); stroke-width: 4px; filter: drop-shadow(0 0 8px var(--color-b)); }
        .connection-line.active-c { stroke: var(--color-c); stroke-width: 4px; filter: drop-shadow(0 0 8px var(--color-c)); }
        .connection-line.active-d { stroke: var(--color-d); stroke-width: 4px; filter: drop-shadow(0 0 8px var(--color-d)); }

        #nodes-container {
            width: 9000px; height: 9000px;
            position: absolute; top: 0; left: 0;
            pointer-events: none;
        }

        .skill-node-wrapper {
            position: absolute; transform: translate(-50%, -50%);
            display: flex; align-items: center;
            pointer-events: auto; cursor: pointer; gap: 8px;
            padding: 15px; 
            margin: -15px;
        }

        .skill-node {
            width: 68px; height: 68px; border-radius: 50%;
            background: #1e293b; border: 4px solid var(--locked-color);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s, border-color 0.3s, box-shadow 0.3s;
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
            position: relative; flex-shrink: 0;
        }

        .skill-node-wrapper:hover .skill-node { 
            transform: scale(1.3); 
            z-index: 25; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.95);
        }

        .skill-node.center-node {
            width: 100px; height: 100px;
            background: radial-gradient(circle, #f59e0b 0%, #b45309 100%);
            border: 5px solid #fef3c7;
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.9);
            font-size: 2.5em;
        }

        .skill-node-wrapper:hover .center-node {
            transform: scale(1.15);
        }

        .skill-node.unlocked-a { border-color: var(--color-a); background: var(--color-a); color: #fff; box-shadow: 0 0 20px var(--color-a); }
        .skill-node.unlocked-b { border-color: var(--color-b); background: var(--color-b); color: #fff; box-shadow: 0 0 20px var(--color-b); }
        .skill-node.unlocked-c { border-color: var(--color-c); background: var(--color-c); color: #fff; box-shadow: 0 0 20px var(--color-c); }
        .skill-node.unlocked-d { border-color: var(--color-d); background: var(--color-d); color: #fff; box-shadow: 0 0 20px var(--color-d); }

        @keyframes pulse-flash {
            0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.9); }
            50% { transform: scale(1.5); filter: brightness(1.4); box-shadow: 0 0 40px 15px rgba(255, 255, 255, 0.8); z-index: 50; }
            100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .skill-node.highlight-flash {
            animation: pulse-flash 1.5s ease-in-out;
        }

        .node-icon { font-size: 1.6em; transition: transform 0.3s ease; }
        .skill-node-wrapper:hover .node-icon { transform: scale(1.1); }

        .node-title-label {
            font-size: 1em; font-weight: 800;
            color: var(--text-main); text-align: center; white-space: nowrap;
            background: rgba(15, 23, 42, 0.98);
            padding: 8px 14px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: absolute; bottom: 85px; left: 50%;
            transform: translateX(-50%) translateY(10px) scale(0.9);
            z-index: 30; pointer-events: none;
        }

        .skill-node-wrapper:hover .node-title-label { 
            opacity: 1; 
            visibility: visible; 
            transform: translateX(-50%) translateY(0) scale(1); 
        }

        .check-badge {
            position: absolute; bottom: -4px; right: -4px;
            background: #0f172a; border: 3px solid currentColor;
            border-radius: 50%; width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8em; font-weight: 900; color: #fff;
        }

        /* --- MENU LATÉRAL GAUCHE --- */
        #sidebar {
            position: fixed; top: 20px; left: 20px; z-index: 200;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            border: 1px solid #334155; border-radius: 14px;
            width: 320px; max-height: calc(100vh - 40px);
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); pointer-events: auto;
            transition: transform 0.3s ease;
        }

        #sidebar.closed { transform: translateX(-350px); }

        .sidebar-header {
            padding: 14px; border-bottom: 1px solid #334155;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: 800; font-size: 0.85em; color: #f8fafc;
        }

        .save-indicator {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.75em; font-weight: 700; padding: 3px 8px;
            border-radius: 12px; background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
        }
        .save-dot {
            width: 9px; height: 9px; border-radius: 50%;
            display: inline-block;
        }
        .save-dot.saved { background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse-save 2s infinite; }
        .save-dot.saving { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .save-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        @keyframes pulse-save {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.25); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .sidebar-toggle-btn {
            position: fixed; top: 20px; left: 355px; z-index: 205;
            background: #1e293b; border: 1px solid #475569; color: #fff;
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold;
            transition: left 0.3s ease, background 0.2s;
        }
        #sidebar.closed ~ .sidebar-toggle-btn { left: 20px; }
        .sidebar-toggle-btn:hover { background: #334155; }

        .sidebar-content {
            overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px;
        }

        .menu-region-title {
            font-size: 0.75em; font-weight: 800; padding: 6px 8px; border-radius: 6px;
            margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(255,255,255,0.05);
        }

        .menu-sub-header {
            font-size: 0.7em; font-weight: 800; padding: 4px 8px;
            margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 4px; border-radius: 4px;
        }

        .menu-node-item {
            padding: 5px 8px; border-radius: 6px; font-size: 0.75em;
            color: var(--text-muted); cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .menu-node-item:hover { background: rgba(255,255,255,0.1); color: var(--text-main); transform: translateX(4px); }

        .hud-scores-box {
            padding: 12px; border-top: 1px solid #334155; background: rgba(11, 17, 32, 0.8);
            display: flex; flex-direction: column; gap: 4px; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;
        }
        .hud-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.75em; }

        .reset-view-btn {
            margin-top: 4px; padding: 6px; background: #1e293b;
            border: 1px solid #475569; color: #cbd5e1;
            font-size: 0.75em; font-weight: 700; border-radius: 6px;
            cursor: pointer; transition: background 0.2s; text-align: center;
        }
        .reset-view-btn:hover { background: #334155; color: #fff; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            z-index: 300; display: none; align-items: center; justify-content: center;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--panel-bg); border-radius: 16px;
            width: 90%; max-width: 480px; padding: 25px;
            border: 2px solid var(--text-muted);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5em; cursor: pointer; color: var(--text-muted); }

        .modal-btn {
            width: 100%; padding: 10px; margin-top: 8px;
            border-radius: 8px; border: none; font-weight: 700;
            cursor: pointer; transition: all 0.2s; text-align: center;
            text-decoration: none; display: inline-block; font-size: 0.9em;
        }

        .link-input {
            width: 100%; padding: 8px 12px; background: #0b1120;
            border: 1px solid #334155; color: var(--text-main);
            border-radius: 6px; font-size: 0.85em; margin-bottom: 8px; outline: none;
        }
        .link-input:focus { border-color: #3b82f6; }

        .doc-btn { background: #3b82f6; color: #fff; }
        .doc-btn:hover { background: #2563eb; }
        .save-btn { background: #10b981; color: #fff; }
        .save-btn:hover { background: #059669; }
    </style>
</head>
<body>

    <div id="galaxy-bg"></div>

    <!-- MENU LATÉRAL -->
    <div id="sidebar">
        <div class="sidebar-header">
            <span>📚 NAVIGATION</span>
            <div class="save-indicator" id="save-indicator" title="État de la sauvegarde locale">
                <span class="save-dot saved" id="save-dot"></span>
                <span id="save-text">Sauvegardé</span>
            </div>
        </div>
        <div class="sidebar-content" id="sidebar-menu-list">
            <!-- Rempli dynamiquement par JS -->
        </div>
        <div class="hud-scores-box">
            <div style="font-size: 0.75em; font-weight: 800; margin-bottom: 2px; color: #f8fafc;">MAÎTRISE GLOBALE</div>
            <div class="hud-row" style="color: var(--color-a);"><span>🔴 Nord (ACM):</span> <span id="score-a">0</span></div>
            <div class="hud-row" style="color: var(--color-b);"><span>🔵 Est (Formateur & BAFA):</span> <span id="score-b">0</span></div>
            <div class="hud-row" style="color: var(--color-c);"><span>🟢 Sud (Pédagogie & IA):</span> <span id="score-c">0</span></div>
            <div class="hud-row" style="color: var(--color-d);"><span>🟣 Ouest (Anglais: Agrégation & CAPES):</span> <span id="score-d">0</span></div>
            <button class="reset-view-btn" onclick="resetView()">🎯 Recentrer sur le Noyau</button>
        </div>
    </div>
    <button class="sidebar-toggle-btn" onclick="toggleSidebar()">☰ Menu</button>

    <div id="world">
        <svg id="svg-canvas">
            <g id="svg-lines-group"></g>
        </svg>
        <div id="nodes-container"></div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-card" id="modal-card">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-badge" style="display:inline-block; padding: 3px 10px; border-radius: 12px; font-weight:800; font-size:0.75em; margin-bottom: 10px;"></div>
            <h2 id="modal-title" style="margin-bottom: 8px; font-size: 1.2em;"></h2>
            <p id="modal-desc" style="color: var(--text-muted); font-size:0.9em; margin-bottom:15px; line-height: 1.4;"></p>
            <div style="background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; margin-bottom: 15px;">
                <strong style="font-size:0.8em; color: var(--text-muted);">ACTIONS & DÉTAILS :</strong>
                <p id="modal-details" style="font-size: 0.85em; margin-top: 5px;"></p>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 0.75em; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 4px;">LIEN DU DOCUMENT (GDOC) :</label>
                <input type="text" id="node-link-input" class="link-input" placeholder="Collez votre lien Google Doc ici...">
                <button class="modal-btn save-btn" onclick="saveNodeLink()" style="margin-top: 4px;">💾 Enregistrer le lien</button>
            </div>

            <a id="modal-doc-link" href="#" target="_blank" class="modal-btn doc-btn" style="display: none; margin-bottom: 8px;">📄 Ouvrir le document (GDoc)</a>
            <button class="modal-btn" id="btn-toggle" onclick="toggleSkill()"></button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'theo_final_app_skills';

        function updateSaveStatus(status) {
            const dot = document.getElementById('save-dot');
            const text = document.getElementById('save-text');
            dot.className = "save-dot " + status;
            if (status === 'saved') text.innerText = "Sauvegardé";
            if (status === 'saving') text.innerText = "Enregistrement...";
            if (status === 'error') text.innerText = "Erreur !";
        }

        function initGalaxy() {
            const bg = document.getElementById('galaxy-bg');
            const starCount = 180;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = `${size}px`; star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`; star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.animationDelay = `${Math.random() * 5}s`;
                bg.appendChild(star);
            }
        }

        const R1 = 700;   
        const R2 = 1400;  
        const R3 = 2200;  
        const R4 = 3000;  
        const R5 = 3800;  

        const graphData = {
            center: { id: "CENTER", icon: "🌟", label: "NOYAU CENTRAL", desc: "Nœud central de compétences professionnelles et académiques.", details: "Point de convergence de l'ensemble de vos expertises professionnelles et universitaires." },
            regions: [
                {
                    key: "A", name: "🔴 Nord (Pilotage ACM Expert)", color: "var(--color-a)", centerAngle: -Math.PI / 2, span: Math.PI / 2.2,

                        { id: "A1.0", icon: "🎯", label: "Branche Projet Éducatif, PEDT & Partenariats", parent: "A1", level: 2, unlocked: true, link: "", desc: "Traduction de la vision éducative, ancrage territorial et relations institutionnelles.", details: "Pilotage des valeurs citoyennes et coordination avec les collectivités." },

                        { id: "A1.2", icon: "🏛️", label: "Ancrage PEDT & Partenariats Mairie", parent: "A1.1", level: 4, unlocked: false, link: "", desc: "Coordination institutionnelle avec les collectivités et services de l'État.", details: "Alignement avec le Projet Éducatif Territorial (PEDT) et négociation partenariale SDJES / CAF." },

                        { id: "A1.4", icon: "📈", label: "Évaluation & Rapport Moral Annuel", parent: "A1.1", level: 4, unlocked: false, link: "", desc: "Analyse d'impact des séjours et restitution aux instances.", details: "Indicateurs quantitatifs/qualitatifs de réussite éducative et rédaction du bilan global." },
                        { id: "A1.5", icon: "📢", label: "Stratégie de Communication Externe", parent: "A1.2", level: 4, unlocked: false, link: "", desc: "Valorisation des actions auprès du grand public et des médias.", details: "Relations presse locale, gestion des réseaux sociaux institutionnels et image de marque de l'ACM." },

                        { id: "A3.2", icon: "📄", label: "Montage de Subventions (CAF/FDVA)", parent: "A3.1", level: 4, unlocked: false, link: "", desc: "Recherche de financements publics et constitution des dossiers.", details: "Prestations de service enfance/jeunesse, fonds de développement de la vie associative et bilans." },
                        { id: "A3.3", icon: "🍳", label: "PMS & HACCP en Restauration Collective", parent: "A3.1", level: 4, unlocked: false, link: "", desc: "Sécurité sanitaire des aliments et chaîne du froid.", details: "Plan de Maîtrise Sanitaire, relevés de températures, traçabilité des plats témoins et contrôles." },

        function updateTransform() {
            const world = document.getElementById('world');
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function resetView() { 
            scale = 0.35; 
            panX = (window.innerWidth / 2) - (4500 * scale);
            panY = (window.innerHeight / 2) - (4500 * scale);
            updateTransform(); 
        }

        function centerOnNode(dx, dy, nodeId = null) {
            scale = 0.65; 
            panX = (window.innerWidth / 2) - ((4500 + dx) * scale);
            panY = (window.innerHeight / 2) - ((4500 + dy) * scale);
            updateTransform();

            if (nodeId && domNodeElements[nodeId]) {
                const el = domNodeElements[nodeId];
                el.classList.remove('highlight-flash');
                void el.offsetWidth; 
                el.classList.add('highlight-flash');
                setTimeout(() => {
                    el.classList.remove('highlight-flash');
                }, 1500);
            }
        }

            const centerItem = document.createElement('div');
            centerItem.className = 'menu-node-item';
            centerItem.style.fontWeight = 'bold';
            centerItem.style.color = '#f59e0b';
            centerItem.innerHTML = `<span>🌟</span> <span>NOYAU CENTRAL (Accueil)</span>`;
            centerItem.onclick = () => { resetView(); };
            listContainer.appendChild(centerItem);

            graphData.regions.forEach(r => {
                const regTitle = document.createElement('div');
                regTitle.className = 'menu-region-title';
                regTitle.style.color = r.color;
                regTitle.innerText = r.name;
                listContainer.appendChild(regTitle);

                const lockedNodes = r.nodes.filter(n => !n.unlocked);
                const unlockedNodes = r.nodes.filter(n => n.unlocked);

                if (lockedNodes.length > 0) {
                    const lockedHeader = document.createElement('div');
                    lockedHeader.className = 'menu-sub-header';
                    lockedHeader.style.color = '#94a3b8';
                    lockedHeader.style.background = 'rgba(148, 163, 184, 0.1)';
                    lockedHeader.innerHTML = `<span>⏳</span> <span>NŒUDS À DÉBLOQUER (${lockedNodes.length})</span>`;
                    listContainer.appendChild(lockedHeader);

                    lockedNodes.forEach(n => {
                        const item = document.createElement('div');
                        item.className = 'menu-node-item';
                        item.style.paddingLeft = '14px';
                        item.innerHTML = `<span>${n.icon}</span> <span>${n.id} - ${n.label}</span>`;
                        item.onclick = () => { centerOnNode(n.dx, n.dy, n.id); };
                        listContainer.appendChild(item);
                    });
                }

                if (unlockedNodes.length > 0) {
                    const unlockedHeader = document.createElement('div');
                    unlockedHeader.className = 'menu-sub-header';
                    unlockedHeader.style.color = r.color;
                    unlockedHeader.style.background = 'rgba(16, 185, 129, 0.1)';
                    unlockedHeader.innerHTML = `<span>✅</span> <span>COMPÉTENCES MAÎTRISÉES (${unlockedNodes.length})</span>`;
                    listContainer.appendChild(unlockedHeader);

                    unlockedNodes.forEach(n => {
                        const item = document.createElement('div');
                        item.className = 'menu-node-item';
                        item.style.paddingLeft = '14px';
                        item.style.fontWeight = '700';
                        item.style.color = '#f8fafc';
                        item.innerHTML = `<span>${n.icon}</span> <span>✓ ${n.id} - ${n.label}</span>`;
                        item.onclick = () => { centerOnNode(n.dx, n.dy, n.id); };
                        listContainer.appendChild(item);
                    });
                }
            });
        }

        function setupPanAndZoom() {
            const world = document.getElementById('world');
            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('#hud-scores') || e.target.closest('.modal-overlay') || e.target.closest('#sidebar') || e.target.closest('.sidebar-toggle-btn')) return;
                isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX; panY = e.clientY - startY; updateTransform();
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('wheel', (e) => {
                if (e.target.closest('#hud-scores') || e.target.closest('.modal-overlay') || e.target.closest('#sidebar') || e.target.closest('.sidebar-toggle-btn')) return;
                e.preventDefault();
                const zoomIntensity = 0.1;
                const rect = world.getBoundingClientRect();
                const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;
                let prevScale = scale;
                if (e.deltaY < 0) { scale *= (1 + zoomIntensity); } else { scale /= (1 + zoomIntensity); }
                scale = Math.max(0.1, Math.min(3, scale));
                panX = mouseX - (mouseX - panX) * (scale / prevScale);
                panY = mouseY - (mouseY - panY) * (scale / prevScale);
                updateTransform();
            }, { passive: false });
        }

        function loadSavedState() {
            let saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) {
                const legacyKeys = [
                    'theo_final_app_skills_smooth_hover',
                    'theo_final_app_skills_merged_west',
                    'theo_final_app_skills_capes_extended',
                    'theo_final_app_skills_anticollision'
                ];
                for (let k of legacyKeys) {
                    const legacyData = localStorage.getItem(k);
                    if (legacyData) {
                        saved = legacyData;
                        break;
                    }
                }
            }

            if (saved) {
                const data = JSON.parse(saved);
                graphData.regions.forEach(r => {
                    r.nodes.forEach(n => {
                        if (data[n.id]) {
                            if (data[n.id].unlocked !== undefined) n.unlocked = data[n.id].unlocked;
                            if (data[n.id].link !== undefined) n.link = data[n.id].link;
                        }
                    });
                });
            }
        }

        function saveState() {
            updateSaveStatus('saving');
            try {
                const data = {};
                graphData.regions.forEach(r => {
                    r.nodes.forEach(n => {
                        data[n.id] = { unlocked: n.unlocked, link: n.link };
                    });
                });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                setTimeout(() => { updateSaveStatus('saved'); }, 400);
            } catch (e) {
                updateSaveStatus('error');
                console.error(e);
            }
        }

        function isNodeUnlocked(id) {
            if (id === "CENTER") return true;
            for (let r of graphData.regions) {
                let found = r.nodes.find(n => n.id === id);
                if (found) return found.unlocked;
            }
            return false;
        }

        function computeRadialPositions() {
            const radii = { 1: R1, 2: R2, 3: R3, 4: R4, 5: R5 };

            graphData.regions.forEach(r => {
                const byLevel = { 1: [], 2: [], 3: [], 4: [], 5: [] };
                r.nodes.forEach(n => {
                    if (byLevel[n.level]) byLevel[n.level].push(n);
                });

                for (let lvl = 1; lvl <= 5; lvl++) {
                    const list = byLevel[lvl];
                    const count = list.length;
                    if (count === 0) continue;

                    list.forEach((n, idx) => {
                        const fraction = count === 1 ? 0.5 : (idx / (count - 1));
                        const angle = r.centerAngle - (r.span / 2) + fraction * r.span;
                        const radius = radii[lvl];

                        n.dx = Math.round(Math.cos(angle) * radius);
                        n.dy = Math.round(Math.sin(angle) * radius);
                    });
                }
            });
        }

        function initGraph() {
            computeRadialPositions();

            const linesGroup = document.getElementById('svg-lines-group');
            const container = document.getElementById('nodes-container');
            linesGroup.innerHTML = ''; container.innerHTML = '';
            domNodeElements = {};

            const cx = 4500; 
            const cy = 4500;

            nodePositions["CENTER"] = { x: cx, y: cy };

            const centerWrap = document.createElement('div');
            centerWrap.className = 'skill-node-wrapper';
            centerWrap.style.left = `${cx}px`; centerWrap.style.top = `${cy}px`;

            const centerEl = document.createElement('div');
            centerEl.className = 'skill-node center-node';
            centerEl.innerHTML = `<span class="node-icon">${graphData.center.icon}</span>`;
            centerWrap.appendChild(centerEl); 
            centerWrap.onclick = (e) => { e.stopPropagation(); openCenterModal(); };
            container.appendChild(centerWrap);

            let hudScores = { A: 0, B: 0, C: 0, D: 0 };

            graphData.regions.forEach(r => {
                r.nodes.forEach(n => {
                    nodePositions[n.id] = { x: cx + n.dx, y: cy + n.dy };
                });
            });

            graphData.regions.forEach(r => {
                let regionCount = 0;

                r.nodes.forEach(n => {
                    if (n.unlocked) regionCount++;
                    const pos = nodePositions[n.id];
                    const parentPos = nodePositions[n.parent];

                    if (parentPos && isNodeUnlocked(n.parent)) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', parentPos.x); line.setAttribute('y1', parentPos.y);
                        line.setAttribute('x2', pos.x); line.setAttribute('y2', pos.y);
                        line.setAttribute('class', `connection-line ${n.unlocked ? 'active-' + r.key.toLowerCase() : ''}`);
                        linesGroup.appendChild(line);
                    }

                    const nodeWrap = document.createElement('div');
                    nodeWrap.className = 'skill-node-wrapper';
                    nodeWrap.style.left = `${pos.x}px`; nodeWrap.style.top = `${pos.y}px`;

                    const nodeEl = document.createElement('div');
                    nodeEl.className = `skill-node ${n.unlocked ? 'unlocked-' + r.key.toLowerCase() : ''}`;
                    nodeEl.innerHTML = `
                        <span class="node-icon">${n.icon}</span>
                        ${n.unlocked ? `<span class="check-badge" style="color:${r.color}">✓</span>` : ''}
                    `;

                    domNodeElements[n.id] = nodeEl;

                    const labelEl = document.createElement('div');
                    labelEl.className = 'node-title-label';
                    labelEl.innerText = n.label;

                    nodeWrap.appendChild(nodeEl); nodeWrap.appendChild(labelEl);
                    nodeWrap.onclick = (e) => { e.stopPropagation(); openModal(n, r); };

                    container.appendChild(nodeWrap);
                });

                hudScores[r.key] = regionCount;
            });

            document.getElementById('score-a').innerText = hudScores.A;
            document.getElementById('score-b').innerText = hudScores.B;
            document.getElementById('score-c').innerText = hudScores.C;
            document.getElementById('score-d').innerText = hudScores.D;
        }

        function openCenterModal() {
            const modal = document.getElementById('modal');
            const card = document.getElementById('modal-card');
            card.style.borderColor = "#f59e0b";
            document.getElementById('modal-title').innerText = `${graphData.center.icon} ${graphData.center.label}`;
            document.getElementById('modal-desc').innerText = graphData.center.desc;
            document.getElementById('modal-details').innerText = graphData.center.details;
            document.getElementById('node-link-input').parentElement.style.display = 'none';
            document.getElementById('modal-doc-link').style.display = 'none';
            document.getElementById('btn-toggle').style.display = 'none';
            modal.style.display = 'flex';
        }

        function openModal(node, region) {
            activeNode = node;
            const modal = document.getElementById('modal');
            const card = document.getElementById('modal-card');
            
            card.style.borderColor = region.color;
            document.getElementById('modal-title').innerText = `${node.icon} ${node.id} - ${node.label}`;
            document.getElementById('modal-desc').innerText = node.desc;
            document.getElementById('modal-details').innerText = node.details;

            document.getElementById('node-link-input').parentElement.style.display = 'block';
            document.getElementById('btn-toggle').style.display = 'block';

            const linkInput = document.getElementById('node-link-input');
            linkInput.value = node.link || "";

            updateDocButtonUI();
            updateModalUI(region);
            modal.style.display = 'flex';
        }

        function saveNodeLink() {
            if (activeNode) {
                const linkInput = document.getElementById('node-link-input');
                activeNode.link = linkInput.value.trim();
                saveState();
                updateDocButtonUI();
            }
        }

        function updateDocButtonUI() {
            const docLinkBtn = document.getElementById('modal-doc-link');
            if (activeNode && activeNode.link && activeNode.link !== "") {
                docLinkBtn.href = activeNode.link;
                docLinkBtn.style.display = "inline-block";
            } else {
                docLinkBtn.style.display = "none";
            }
        }

        function updateModalUI(region) {
            const badge = document.getElementById('modal-badge');
            const btn = document.getElementById('btn-toggle');
            
            if (activeNode.unlocked) {
                badge.style.background = region.color;
                badge.style.color = "#fff";
                badge.innerText = "STATUT : MAÎTRISÉ (DÉBLOQUÉ)";
                btn.innerText = "Verrouiller (Remettre à zéro)";
                btn.style.background = "#ef4444";
                btn.style.color = "#fff";
            } else {
                badge.style.background = "#334155";
                badge.style.color = "#aaa";
                badge.innerText = "STATUT : À DÉBLOQUER";
                btn.innerText = "Marquer comme maîtrisé (Débloquer)";
                btn.style.background = "#10b981";
                btn.style.color = "#fff";
            }
        }

        function toggleSkill() {
            if (activeNode) {
                activeNode.unlocked = !activeNode.unlocked;

                if (activeNode.unlocked) {
                    let curr = activeNode;
                    while (curr && curr.parent && curr.parent !== "CENTER") {
                        let parentNode = null;
                        for (let r of graphData.regions) {
                            let found = r.nodes.find(n => n.id === curr.parent);
                            if (found) {
                                parentNode = found;
                                break;
                            }
                        }
                        if (parentNode) {
                            parentNode.unlocked = true;
                            curr = parentNode;
                        } else {
                            break;
                        }
                    }
                }

                saveState();
                initGraph();
                buildSidebarMenu();
                closeModal();
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        loadSavedState();
        initGalaxy();
        initGraph();
        buildSidebarMenu();
        
        scale = 0.35;
        panX = (window.innerWidth / 2) - (4500 * scale);
        panY = (window.innerHeight / 2) - (4500 * scale);
        updateTransform();

        setupPanAndZoom();
    </script>
</body>
</html>
