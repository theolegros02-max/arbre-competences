<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Compétences - Théo Legros</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #1a1d2d;
            --text-color: #e0e6ed;
            --accent-red: #e74c3c;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-purple: #9b59b6;
            --locked-color: #4a4e69;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            text-align: center;
            color: #8f9bb3;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .tree-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .region-column {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .region-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid;
            width: 100%;
        }

        .region-a { border-color: var(--accent-red); color: var(--accent-red); }
        .region-b { border-color: var(--accent-blue); color: var(--accent-blue); }
        .region-c { border-color: var(--accent-green); color: var(--accent-green); }
        .region-d { border-color: var(--accent-purple); color: var(--accent-purple); }

        .constellation-group {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
        }

        .constellation-name {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
            border-left: 3px solid currentColor;
            padding-left: 8px;
        }

        .nodes-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .node-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .node-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
        }

        .node-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 0.75em;
            flex-shrink: 0;
            border: 2px solid;
        }

        .node-item.unlocked .node-circle {
            background: currentColor;
            color: #111;
            border-color: currentColor;
        }
        .node-item.unlocked .node-text {
            color: #fff;
        }

        .node-item.locked .node-circle {
            background: #111;
            border-color: var(--locked-color);
            color: var(--locked-color);
        }
        .node-item.locked .node-text {
            color: #8a8d9b;
        }

        .node-text {
            font-size: 0.85em;
            line-height: 1.2;
            flex-grow: 1;
        }

        /* Modal (Popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            border: 2px solid #fff;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }
        .close-btn:hover { color: #fff; }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .badge-unlocked { background: var(--accent-green); color: #000; }
        .badge-locked { background: var(--locked-color); color: #fff; }

        .action-btn {
            margin-top: 15px;
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        .action-btn:hover { background: #2980b9; }
    </style>
</head>

                            { id: "D1.A", label: "Analyse syntaxique SVO", unlocked: true, desc: "Maîtrise de la syntaxe anglaise et des relations prédicatives S/P.", details: "Déconstruction des phrases simples/complexes et principes d'assertion." },
                            { id: "D1.B", label: "Phonologie des terminaisons -ed", unlocked: true, desc: "Analyse morpho-phonologique et transcription des terminaisons verbales.", details: "Justification scientifique des réalisations /t/, /d/, /id/." },
                            { id: "D1.1", label: "Subtilités d'énonciation", unlocked: false, desc: "Maîtrise des mécanismes d'énonciation et de co-énonciation.", details: "Analyser l'impact du contexte énonciatif sur l'énoncé." },
                            { id: "D1.2", label: "Traduction spécialisée", unlocked: false, desc: "Pratique experte de la traduction littéraire et spécialisée (thème/version).", details: "Restitution fidèle des nuances stylistiques et grammaticales." },
                            { id: "D1.3", label: "Intégration des faits de langue", unlocked: false, desc: "Intégration rigoureuse des faits de langue dans la conception de séquences.", details: "Articuler grammaire et sens dans l'enseignement des langues." },
                            { id: "D1.4", label: "Analyse de corpus littéraire", unlocked: false, desc: "Analyse critique de corpus textuels et culturels (épreuve écrite CAPES).", details: "Méthodologie universitaire de composition et comparaison de textes." },
                            { id: "D1.5", label: "Grammaire universitaire avancée", unlocked: false, desc: "Maîtrise des concepts d'analyse grammaticale universitaire approfondie.", details: "Étude des syntagmes, des groupes nominaux et des subordonnées." }
                        ]
                    },
                    {
                        name: "D2 : Didactique & Polyvalence Pédagogique",
                        nodes: [
                            { id: "D2.A", label: "Différenciation multi-niveaux", unlocked: true, desc: "Adaptation de la posture et des supports à la diversité des élèves.", details: "Expérience du collège au BTS (6e, 3e, Seconde, Terminale, BTS)." },
                            { id: "D2.B", label: "Anglais professionnel & Spécialité", unlocked: true, desc: "Conception de parcours en langues de spécialité.", details: "Enseignement en STMG, CAP et BTS Banque axé sur la négociation." },
                            { id: "D2.1", label: "Parcours de suivi à long terme", unlocked: false, desc: "Élaboration de plans de suivi de progression des apprenants.", details: "Assurer la continuité pédagogique et l'accompagnement personnalisé." },
                            { id: "D2.2", label: "Séquences sur les axes culturels", unlocked: false, desc: "Structuration de séquences adossées aux axes culturels institutionnels.", details: "Conception de dossiers thématiques conformes aux programmes du lycée." },
                            { id: "D2.3", label: "Création de ressources sur-mesure", unlocked: false, desc: "Création de ressources pédagogiques sur-mesure pour classes hétérogènes.", details: "Dédramatiser l'erreur et libérer la prise de parole par le jeu." },
                            { id: "D2.4", label: "Évaluations alignées CECRL", unlocked: false, desc: "Conception d'évaluations par compétences alignées sur le CECRL.", details: "Mesurer l'acquisition des compétences langagières et communicationnelles." },
                            { id: "D2.5", label: "Soutenance de leçon (Oral CAPES)", unlocked: false, desc: "Argumentation et démonstration orale de séquences didactiques.", details: "Présentation de séquences, choix méthodologiques et entretien avec le jury." }
                        ]
                    }
                ]
            }
        ];

        // CHARGEMENT DE L'ÉTAT SAUVEGARDÉ (localStorage)
        function loadSavedState() {
            const saved = localStorage.getItem('theo_skills_state');
            if (saved) {
                const stateMap = JSON.parse(saved);
                treeData.forEach(reg => {
                    reg.constellations.forEach(c => {
                        c.nodes.forEach(n => {
                            if (stateMap[n.id] !== undefined) {
                                n.unlocked = stateMap[n.id];
                            }
                        });
                    });
                });
            }
        }

        // SAUVEGARDE DE L'ÉTAT
        function saveState() {
            const stateMap = {};
            treeData.forEach(reg => {
                reg.constellations.forEach(c => {
                    c.nodes.forEach(n => {
                        stateMap[n.id] = n.unlocked;
                    });
                });
            });
            localStorage.setItem('theo_skills_state', JSON.stringify(stateMap));
        }

        // RENDU VISUEL DE L'ARBRE
        function renderTree() {
            const container = document.getElementById('treeContainer');
            container.innerHTML = '';

            treeData.forEach(reg => {
                const col = document.createElement('div');
                col.className = `region-column ${reg.regionClass}`;
                
                const title = document.createElement('div');
                title.className = 'region-title';
                title.innerText = reg.regionTitle;
                col.appendChild(title);

                reg.constellations.forEach(c => {
                    const constGroup = document.createElement('div');
                    constGroup.className = 'constellation-group';

                    const constName = document.createElement('div');
                    constName.className = 'constellation-name';
                    constName.style.color = reg.regionColor;
                    constName.innerText = c.name;
                    constGroup.appendChild(constName);

                    const nodesGrid = document.createElement('div');
                    nodesGrid.className = 'nodes-grid';

                    c.nodes.forEach(n => {
                        const nodeItem = document.createElement('div');
                        nodeItem.className = `node-item ${n.unlocked ? 'unlocked' : 'locked'}`;
                        if(n.unlocked) nodeItem.style.color = reg.regionColor;

                        nodeItem.innerHTML = `
                            <div class="node-circle" style="border-color: ${reg.regionColor}">${n.id}</div>
                            <div class="node-text">${n.label}</div>
                        `;

                        // Clic sur l'item pour ouvrir la modale détaillée
                        nodeItem.onclick = () => openModal(n, reg.regionColor);

                        nodesGrid.appendChild(nodeItem);
                    });

                    constGroup.appendChild(nodesGrid);
                    col.appendChild(constGroup);
                });

                container.appendChild(col);
            });
        }

        let currentNode = null;
        let currentColor = "";

        // GESTION DU MODAL (POPUP)
        function openModal(node, color) {
            currentNode = node;
            currentColor = color;
            const modal = document.getElementById('nodeModal');
            const modalContent = document.getElementById('modalContent');
            
            modalContent.style.borderColor = color;
            document.getElementById('modalTitle').innerText = `${node.id} - ${node.label}`;
            document.getElementById('modalDesc').innerText = node.desc;
            document.getElementById('modalDetails').innerText = node.details;
            
            updateModalBadge();
            modal.style.display = 'flex';
        }

        function updateModalBadge() {
            const badge = document.getElementById('modalBadge');
            const btn = document.getElementById('toggleStatusBtn');
            if(currentNode.unlocked) {
                badge.className = "status-badge badge-unlocked";
                badge.innerText = "STATUT : MAÎTRISÉ / DÉBLOQUÉ";
                btn.innerText = "Verrouiller à nouveau";
                btn.style.background = "#e74c3c";
            } else {
                badge.className = "status-badge badge-locked";
                badge.innerText = "STATUT : À DÉBLOQUER";
                btn.innerText = "Marquer comme maîtrisé (Débloquer)";
                btn.style.background = "#2ecc71";
            }
        }

        function toggleCurrentNodeStatus() {
            if (currentNode) {
                currentNode.unlocked = !currentNode.unlocked;
                saveState();
                renderTree();
                updateModalBadge();
            }
        }

        function closeModal() {
            document.getElementById('nodeModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('nodeModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Initialisation au chargement de la page
        loadSavedState();
        renderTree();
    </script>
</body>
</html>
