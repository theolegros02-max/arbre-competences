<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Compétences - Théo Legros</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #12141d;
            --card-bg: #1a1d29;
            --text-main: #f0f3f8;
            --text-muted: #7e859b;
            --locked-node: #252836;
            --locked-border: #3d4257;
            --locked-line: #2d3245;
            
            /* Color schemes per region */
            --red-main: #ff334b;
            --red-glow: rgba(255, 51, 75, 0.4);
            --blue-main: #2bb0ff;
            --blue-glow: rgba(43, 176, 255, 0.4);
            --green-main: #2ecc71;
            --green-glow: rgba(46, 204, 113, 0.4);
            --purple-main: #a55eea;
            --purple-glow: rgba(165, 94, 234, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: auto;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 30%, #1e2235 0%, #12141d 70%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        header {
            text-align: center;
            padding: 25px 20px 10px;
            position: relative;
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            font-weight: 800;
        }

        header p {
            margin: 6px 0 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Skill Tree Container & Canvas SVG */
        .tree-viewport {
            position: relative;
            width: 1480px;
            height: 900px;
            margin: 0 auto;
            display: block;
        }

        svg#connection-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .branch-line {
            fill: none;
            stroke-linecap: round;
            transition: stroke 0.4s ease, stroke-width 0.4s ease, filter 0.4s ease;
        }

        /* Region Summaries / Subtitles */
        .region-header {
            position: absolute;
            text-align: center;
            z-index: 5;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .region-header .title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .region-header .score {
            font-size: 2.2rem;
            font-weight: 900;
            margin-top: -2px;
            line-height: 1;
        }

        /* Nodes Visual Style */
        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .node:hover {
            transform: translate(-50%, -50%) scale(1.18);
            z-index: 20;
        }

        .node-circle {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--locked-node);
            border: 3px solid var(--locked-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .node.root-node .node-circle {
            width: 72px;
            height: 72px;
            font-size: 1.6rem;
        }

        /* Node Counters (e.g. 5/5, 0/5) */
        .node-badge {
            position: absolute;
            bottom: -8px;
            background: #10121a;
            border: 1.5px solid var(--locked-border);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        .node-title-sub {
            position: absolute;
            top: 100%;
            margin-top: 10px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-align: center;
            width: 110px;
            pointer-events: none;
            line-height: 1.1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* Unlocked Node Glow Effects by Region */
        .node[data-region="A"].unlocked .node-circle {
            border-color: var(--red-main);
            color: var(--red-main);
            box-shadow: 0 0 18px var(--red-glow), inset 0 0 10px var(--red-glow);
            background: radial-gradient(circle, #3d1017 0%, #1a1d29 100%);
        }
        .node[data-region="A"].unlocked .node-badge {
            border-color: var(--red-main);
            color: #fff;
            background: var(--red-main);
        }

        .node[data-region="B"].unlocked .node-circle {
            border-color: var(--blue-main);
            color: var(--blue-main);
            box-shadow: 0 0 18px var(--blue-glow), inset 0 0 10px var(--blue-glow);
            background: radial-gradient(circle, #0e2b40 0%, #1a1d29 100%);
        }
        .node[data-region="B"].unlocked .node-badge {
            border-color: var(--blue-main);
            color: #fff;
            background: var(--blue-main);
        }

        .node[data-region="C"].unlocked .node-circle {
            border-color: var(--green-main);
            color: var(--green-main);
            box-shadow: 0 0 18px var(--green-glow), inset 0 0 10px var(--green-glow);
            background: radial-gradient(circle, #0e3d20 0%, #1a1d29 100%);
        }
        .node[data-region="C"].unlocked .node-badge {
            border-color: var(--green-main);
            color: #111;
            background: var(--green-main);
        }

        .node[data-region="D"].unlocked .node-circle {
            border-color: var(--purple-main);
            color: var(--purple-main);
            box-shadow: 0 0 18px var(--purple-glow), inset 0 0 10px var(--purple-glow);
            background: radial-gradient(circle, #2f1245 0%, #1a1d29 100%);
        }
        .node[data-region="D"].unlocked .node-badge {
            border-color: var(--purple-main);
            color: #fff;
            background: var(--purple-main);
        }

        /* Fully Mastered Nodes (Max points) */
        .node.mastered .node-circle {
            animation: pulse-glow 2.5s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.35); }
        }

        /* Popup / Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 10, 15, 0.85);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-card {
            background: #161925;
            border: 2px solid var(--locked-border);
            border-radius: 16px;
            width: 90%;
            max-width: 520px;
            padding: 28px;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: translateY(0);
            transition: border-color 0.3s ease;
        }

        .modal-close {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 1.4rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .modal-title {
            margin: 0 0 10px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.25;
        }

        .modal-desc {
            color: #b0b8ce;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-details {
            background: rgba(0,0,0,0.3);
            border-left: 3px solid var(--locked-border);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            font-size: 0.88rem;
            color: #d1d7e6;
            margin-bottom: 25px;
            line-height: 1.45;
        }

        /* Controls inside modal */
        .level-control-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.03);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 20px;
        }

        .level-btn {
            background: var(--locked-node);
            border: 1px solid var(--locked-border);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .level-btn:hover:not(:disabled) {
            background: var(--locked-border);
            transform: scale(1.05);
        }

        .level-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .level-display {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .btn-toggle-max {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Floating Controls bottom */
        .reset-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .btn-reset {
            background: rgba(26, 29, 41, 0.9);
            border: 1px solid var(--locked-border);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .btn-reset:hover {
            color: #fff;
            border-color: var(--red-main);
            background: rgba(231, 76, 60, 0.2);
        }
    </style>
</head>

            { id: "D1", region: "D", icon: "fa-spell-check", x: 610, y: 140, title: "D1: Linguistique SVO", maxPoints: 1, desc: "Analyse syntaxique approfondie et énonciation.", details: "Relations prédicatives, grammaire universitaire et étude de corpus.", parent: "D_ROOT" },
            { id: "D1.1", region: "D", icon: "fa-quote-left", x: 490, y: 100, title: "D1.1: Énonciation", maxPoints: 5, desc: "Mécanismes d'énonciation et repérages temporels/aspectuels.", details: "Subtilités de la linguistique de l'énonciation anglaise.", parent: "D1" },
            { id: "D1.2", region: "D", icon: "fa-language", x: 530, y: 220, title: "D1.2: Phonologie", maxPoints: 5, desc: "Morpho-phonologie des terminaisons (-ed, s) et accentuation.", details: "Justification scientifique des règles phonologiques.", parent: "D1" },

            { id: "D2", region: "D", icon: "fa-school", x: 870, y: 140, title: "D2: Didactique 6e-BTS", maxPoints: 1, desc: "Ingénierie didactique pour le secondaire et supérieur.", details: "Progression par compétences CECRL, séquences thématiques et différenciation.", parent: "D_ROOT" },
            { id: "D2.1", region: "D", icon: "fa-sliders", x: 950, y: 220, title: "D2.1: Différenciation", maxPoints: 5, desc: "Pédagogie différenciée multi-niveaux (Collège, Lycée, BTS).", details: "Adaptation des supports et autonomie des apprenants.", parent: "D2" },
            { id: "D2.2", region: "D", icon: "fa-briefcase", x: 990, y: 100, title: "D2.2: Anglais Spécialité", maxPoints: 5, desc: "Didactique de l'anglais professionnel et de spécialité (STMG, BTS).", details: "Conception de jeux de rôle de négociation et monde des affaires.", parent: "D2" }
        ];

        // State Store
        let userProgress = {};
        let activeNodeId = null;

        // Load progress from localStorage
        function loadState() {
            const saved = localStorage.getItem('theo_skilltree_v2');
            if (saved) {
                try {
                    userProgress = JSON.parse(saved);
                } catch(e) {
                    userProgress = {};
                }
            } else {
                // Default unlocks for roots
                userProgress = {
                    "A_ROOT": 1, "B_ROOT": 1, "C_ROOT": 1, "D_ROOT": 1,
                    "A1": 1, "B1": 1, "C1": 1, "D1": 1, "D2": 1,
                    "D1.2": 5, "D2.1": 5
                };
            }
        }

        function saveState() {
            localStorage.setItem('theo_skilltree_v2', JSON.stringify(userProgress));
        }

        function getNodePoints(id) {
            return userProgress[id] || 0;
        }

        // Render functions
        function renderTree() {
            const viewport = document.getElementById('treeViewport');
            const svg = document.getElementById('connection-svg');
            
            // Clear existing node DOM elements (keep SVG)
            document.querySelectorAll('.node, .region-header').forEach(el => el.remove());
            svg.innerHTML = '';

            // Calculate Region Total Scores
            const regionScores = { A: 0, B: 0, C: 0, D: 0 };
            nodesData.forEach(n => {
                regionScores[n.region] += getNodePoints(n.id);
            });

            // 1. Render Region Subtitle/Score Headers
            Object.keys(regionConfig).forEach(regKey => {
                const cfg = regionConfig[regKey];
                const header = document.createElement('div');
                header.className = 'region-header';
                header.style.left = cfg.headerPos.x + 'px';
                header.style.top = cfg.headerPos.y + 'px';
                header.innerHTML = `
                    <div class="title" style="color: ${cfg.color}">${cfg.name}</div>
                    <div class="score" style="color: ${cfg.color}">${regionScores[regKey]}</div>
                `;
                viewport.appendChild(header);
            });

            // Map nodes by ID for fast position lookup
            const nodeMap = {};
            nodesData.forEach(n => nodeMap[n.id] = n);

            // 2. Render SVG Branch Connecting Lines
            nodesData.forEach(n => {
                if (n.parent && nodeMap[n.parent]) {
                    const parentNode = nodeMap[n.parent];
                    const pPts = getNodePoints(parentNode.id);
                    const nPts = getNodePoints(n.id);

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('x1', parentNode.x);
                    line.setAttribute('y1', parentNode.y);
                    line.setAttribute('x2', n.x);
                    line.setAttribute('y2', n.y);
                    line.classList.add('branch-line');

                    const isConnectedAndUnlocked = pPts > 0 && nPts > 0;
                    const regionColor = regionConfig[n.region].color;

                    if (isConnectedAndUnlocked) {
                        line.setAttribute('stroke', regionColor);
                        line.setAttribute('stroke-width', '4');
                        line.setAttribute('filter', `drop-shadow(0 0 6px ${regionConfig[n.region].glow})`);
                    } else {
                        line.setAttribute('stroke', '#2b3044');
                        line.setAttribute('stroke-width', '2.5');
                    }

                    svg.appendChild(line);
                }
            });

            // 3. Render Nodes
            nodesData.forEach(n => {
                const points = getNodePoints(n.id);
                const isUnlocked = points > 0;
                const isMastered = points === n.maxPoints;

                const nodeEl = document.createElement('div');
                nodeEl.className = `node ${n.isRoot ? 'root-node' : ''} ${isUnlocked ? 'unlocked' : ''} ${isMastered ? 'mastered' : ''}`;
                nodeEl.style.left = n.x + 'px';
                nodeEl.style.top = n.y + 'px';
                nodeEl.setAttribute('data-region', n.region);

                nodeEl.innerHTML = `
                    <div class="node-circle">
                        <i class="fa-solid ${n.icon}"></i>
                        <div class="node-badge">${points}/${n.maxPoints}</div>
                    </div>
                    <div class="node-title-sub">${n.title}</div>
                `;

                nodeEl.onclick = () => openModal(n.id);
                viewport.appendChild(nodeEl);
            });
        }

        // Modal Management
        function openModal(nodeId) {
            activeNodeId = nodeId;
            const node = nodesData.find(n => n.id === nodeId);
            const regCfg = regionConfig[node.region];
            const currentPoints = getNodePoints(nodeId);

            const card = document.getElementById('modalCard');
            card.style.borderColor = regCfg.color;

            const tag = document.getElementById('modalTag');
            tag.innerText = regCfg.name;
            tag.style.background = regCfg.color;
            tag.style.color = node.region === 'C' ? '#111' : '#fff';

            document.getElementById('modalTitle').innerText = `${node.id} - ${node.title}`;
            document.getElementById('modalDesc').innerText = node.desc;
            document.getElementById('modalDetails').innerText = node.details;

            updateModalControls(node, currentPoints, regCfg);

            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function updateModalControls(node, points, regCfg) {
            document.getElementById('levelDisplay').innerText = `${points} / ${node.maxPoints}`;
            document.getElementById('btnDec').disabled = (points <= 0);
            document.getElementById('btnInc').disabled = (points >= node.maxPoints);

            const maxBtn = document.getElementById('btnToggleMax');
            if (points === node.maxPoints) {
                maxBtn.innerText = "Réinitialiser ce nœud (0 point)";
                maxBtn.style.background = "#2b3044";
                maxBtn.style.color = "#fff";
            } else {
                maxBtn.innerText = "Maximaliser (Débloquer Tout)";
                maxBtn.style.background = regCfg.color;
                maxBtn.style.color = node.region === 'C' ? '#111' : '#fff';
            }
        }

        function adjustLevel(delta) {
            if (!activeNodeId) return;
            const node = nodesData.find(n => n.id === activeNodeId);
            let current = getNodePoints(activeNodeId);
            current = Math.max(0, Math.min(node.maxPoints, current + delta));
            
            userProgress[activeNodeId] = current;
            saveState();
            renderTree();
            updateModalControls(node, current, regionConfig[node.region]);
        }

        function toggleMaxLevel() {
            if (!activeNodeId) return;
            const node = nodesData.find(n => n.id === activeNodeId);
            let current = getNodePoints(activeNodeId);
            
            if (current === node.maxPoints) {
                userProgress[activeNodeId] = 0;
            } else {
                userProgress[activeNodeId] = node.maxPoints;
            }

            saveState();
            renderTree();
            updateModalControls(node, userProgress[activeNodeId], regionConfig[node.region]);
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            activeNodeId = null;
        }

        function resetProgress() {
            if (confirm("Voulez-vous réinitialiser toute la progression de l'arbre ?")) {
                userProgress = {};
                saveState();
                renderTree();
            }
        }

        // Close modal when clicking background overlay
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Initialize on load
        loadState();
        renderTree();
    </script>
</body>
</html>
