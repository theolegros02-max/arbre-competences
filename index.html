<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbre de Compétences - Théo Legros (Version Sud & Pédagogie IA)</title>
    <style>
        :root {
            --bg-color: #0b1120;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --color-a: #ef4444; /* Nord / Rouge - Pilotage ACM Expert */
            --color-b: #3b82f6; /* Est / Bleu - Formation RH */
            --color-c: #10b981; /* Sud / Vert - Pédagogie, Youth & IA Pédagogique */
            --color-d: #a855f7; /* Ouest / Violet - CAPES Anglais Expert */
            --locked-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            width: 100vw; height: 100vh;
            position: relative;
        }

        #galaxy-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0b1120 80%);
            pointer-events: none;
        }

        .star {
            position: absolute; background: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #3b82f6); }
        }

        #world {
            position: absolute; top: 0; left: 0; width: 10000px; height: 10000px;
            transform-origin: 0 0; cursor: grab; z-index: 1;
        }

        #world:active { cursor: grabbing; }

        #svg-canvas {
            width: 10000px; height: 10000px;
            position: absolute; top: 0; left: 0;
            pointer-events: none;
        }

        .connection-line {
            stroke: var(--locked-color);
            stroke-width: 4px;
            transition: stroke 0.3s ease;
        }

        .connection-line.active-a { stroke: var(--color-a); stroke-width: 5px; filter: drop-shadow(0 0 10px var(--color-a)); }
        .connection-line.active-b { stroke: var(--color-b); stroke-width: 5px; filter: drop-shadow(0 0 10px var(--color-b)); }
        .connection-line.active-c { stroke: var(--color-c); stroke-width: 5px; filter: drop-shadow(0 0 10px var(--color-c)); }
        .connection-line.active-d { stroke: var(--color-d); stroke-width: 5px; filter: drop-shadow(0 0 10px var(--color-d)); }

        #nodes-container {
            width: 10000px; height: 10000px;
            position: absolute; top: 0; left: 0;
            pointer-events: none;
        }

        .skill-node-wrapper {
            position: absolute; transform: translate(-50%, -50%);
            display: flex; align-items: center;
            pointer-events: auto; cursor: pointer; gap: 8px;
        }

        .skill-node {
            width: 76px; height: 76px; border-radius: 50%;
            background: #1e293b; border: 4px solid var(--locked-color);
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s, border-color 0.3s;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
            position: relative; flex-shrink: 0;
        }

        .skill-node-wrapper:hover .skill-node { transform: scale(1.25); z-index: 10; }

        .skill-node.center-node {
            width: 110px; height: 110px;
            background: radial-gradient(circle, #f59e0b 0%, #b45309 100%);
            border: 5px solid #fef3c7;
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.9);
            font-size: 2.8em;
        }

        .skill-node.unlocked-a { border-color: var(--color-a); background: var(--color-a); color: #fff; box-shadow: 0 0 25px var(--color-a); }
        .skill-node.unlocked-b { border-color: var(--color-b); background: var(--color-b); color: #fff; box-shadow: 0 0 25px var(--color-b); }
        .skill-node.unlocked-c { border-color: var(--color-c); background: var(--color-c); color: #fff; box-shadow: 0 0 25px var(--color-c); }
        .skill-node.unlocked-d { border-color: var(--color-d); background: var(--color-d); color: #fff; box-shadow: 0 0 25px var(--color-d); }

        .node-icon { font-size: 1.8em; }

        .node-title-label {
            font-size: 1.1em; font-weight: 800;
            color: var(--text-main); text-align: center; white-space: nowrap;
            background: rgba(15, 23, 42, 0.98);
            padding: 10px 16px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 6px 20px rgba(0,0,0,0.9);
            opacity: 0; visibility: hidden;
            transition: opacity 0.25s ease, transform 0.25s ease;
            position: absolute; bottom: 85px; left: 50%;
            transform: translateX(-50%) translateY(6px);
            z-index: 20; pointer-events: none;
        }

        .skill-node-wrapper:hover .node-title-label { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

        .check-badge {
            position: absolute; bottom: -4px; right: -4px;
            background: #0f172a; border: 3px solid currentColor;
            border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9em; font-weight: 900; color: #fff;
        }

        /* --- MENU LATÉRAL GAUCHE --- */
        #sidebar {
            position: fixed; top: 20px; left: 20px; z-index: 200;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px);
            border: 1px solid #334155; border-radius: 14px;
            width: 310px; max-height: calc(100vh - 40px);
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); pointer-events: auto;
            transition: transform 0.3s ease;
        }

        #sidebar.closed { transform: translateX(-340px); }

        .sidebar-header {
            padding: 14px; border-bottom: 1px solid #334155;
            display: flex; justify-content: space-between; align-items: center;
            font-weight: 800; font-size: 0.85em; color: #f8fafc;
        }

        .sidebar-toggle-btn {
            position: fixed; top: 20px; left: 345px; z-index: 205;
            background: #1e293b; border: 1px solid #475569; color: #fff;
            padding: 10px 12px; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); font-weight: bold;
            transition: left 0.3s ease, background 0.2s;
        }
        #sidebar.closed ~ .sidebar-toggle-btn { left: 20px; }
        .sidebar-toggle-btn:hover { background: #334155; }

        .sidebar-content {
            overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 12px;
        }

        .menu-region-title {
            font-size: 0.75em; font-weight: 800; padding: 4px 8px; border-radius: 6px;
            margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .menu-node-item {
            padding: 6px 10px; border-radius: 6px; font-size: 0.75em;
            color: var(--text-muted); cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .menu-node-item:hover { background: rgba(255,255,255,0.1); color: var(--text-main); transform: translateX(4px); }

        .hud-scores-box {
            padding: 12px; border-top: 1px solid #334155; background: rgba(11, 17, 32, 0.8);
            display: flex; flex-direction: column; gap: 4px; border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;
        }
        .hud-row { display: flex; justify-content: space-between; font-weight: 700; font-size: 0.75em; }

        .reset-view-btn {
            margin-top: 4px; padding: 6px; background: #1e293b;
            border: 1px solid #475569; color: #cbd5e1;
            font-size: 0.75em; font-weight: 700; border-radius: 6px;
            cursor: pointer; transition: background 0.2s; text-align: center;
        }
        .reset-view-btn:hover { background: #334155; color: #fff; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
            z-index: 300; display: none; align-items: center; justify-content: center;
            pointer-events: auto;
        }

        .modal-card {
            background: var(--panel-bg); border-radius: 16px;
            width: 90%; max-width: 480px; padding: 25px;
            border: 2px solid var(--text-muted);
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); position: relative;
        }

        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5em; cursor: pointer; color: var(--text-muted); }

        .modal-btn {
            width: 100%; padding: 10px; margin-top: 8px;
            border-radius: 8px; border: none; font-weight: 700;
            cursor: pointer; transition: all 0.2s; text-align: center;
            text-decoration: none; display: inline-block; font-size: 0.9em;
        }

        .link-input {
            width: 100%; padding: 8px 12px; background: #0b1120;
            border: 1px solid #334155; color: var(--text-main);
            border-radius: 6px; font-size: 0.85em; margin-bottom: 8px; outline: none;
        }
        .link-input:focus { border-color: #3b82f6; }

        .doc-btn { background: #3b82f6; color: #fff; }
        .doc-btn:hover { background: #2563eb; }
        .save-btn { background: #10b981; color: #fff; }
        .save-btn:hover { background: #059669; }
    </style>
</head>

    <!-- MENU LATÉRAL -->
    <div id="sidebar">

            <button class="modal-btn" id="btn-toggle" onclick="toggleSkill()"></button>
        </div>
    </div>

                        { id: "D5.5", icon: "🧩", label: "Inclusion & Élèves à Besoins Éducatifs (EBEP)", parent: "D5.3", dx: -750, dy: 1750, unlocked: false, link: "", desc: "Accueil des élèves en situation de handicap.", details: "Coordination avec les AESH, mise en place des PAI/PPS/PAP et adaptations pédagogiques." }

        };

        let activeNode = null;
        let nodePositions = {};

        let scale = 0.20; 
        let panX = 0; 
        let panY = 0; 
        let isDragging = false; let startX = 0; let startY = 0;

        function updateTransform() {
            const world = document.getElementById('world');
            world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function resetView() { 
            scale = 0.20; 
            panX = (window.innerWidth / 2) - (5000 * scale);
            panY = (window.innerHeight / 2) - (5000 * scale);
            updateTransform(); 
        }

        function centerOnNode(dx, dy) {
            scale = 0.60; 
            panX = (window.innerWidth / 2) - ((5000 + dx) * scale);
            panY = (window.innerHeight / 2) - ((5000 + dy) * scale);
            updateTransform();
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('closed');
        }

        function buildSidebarMenu() {
            const listContainer = document.getElementById('sidebar-menu-list');
            listContainer.innerHTML = '';

            const centerItem = document.createElement('div');
            centerItem.className = 'menu-node-item';
            centerItem.style.fontWeight = 'bold';
            centerItem.style.color = '#f59e0b';
            centerItem.innerHTML = `<span>🌟</span> <span>NOYAU CENTRAL (Accueil)</span>`;
            centerItem.onclick = () => { resetView(); };
            listContainer.appendChild(centerItem);

            graphData.regions.forEach(r => {
                const regTitle = document.createElement('div');
                regTitle.className = 'menu-region-title';
                regTitle.style.color = r.color;
                regTitle.style.marginTop = '10px';
                regTitle.innerText = r.name;
                listContainer.appendChild(regTitle);

                r.nodes.forEach(n => {
                    const item = document.createElement('div');
                    item.className = 'menu-node-item';
                    item.innerHTML = `<span>${n.icon}</span> <span>${n.id} - ${n.label}</span>`;
                    item.onclick = () => { centerOnNode(n.dx, n.dy); };
                    listContainer.appendChild(item);
                });
            });
        }

        function setupPanAndZoom() {
            const world = document.getElementById('world');
            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('#hud-scores') || e.target.closest('.modal-overlay') || e.target.closest('#sidebar') || e.target.closest('.sidebar-toggle-btn')) return;
                isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX; panY = e.clientY - startY; updateTransform();
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('wheel', (e) => {
                if (e.target.closest('#hud-scores') || e.target.closest('.modal-overlay') || e.target.closest('#sidebar') || e.target.closest('.sidebar-toggle-btn')) return;
                e.preventDefault();
                const zoomIntensity = 0.1;
                const rect = world.getBoundingClientRect();
                const mouseX = e.clientX - rect.left; const mouseY = e.clientY - rect.top;
                let prevScale = scale;
                if (e.deltaY < 0) { scale *= (1 + zoomIntensity); } else { scale /= (1 + zoomIntensity); }
                scale = Math.max(0.05, Math.min(3, scale));
                panX = mouseX - (mouseX - panX) * (scale / prevScale);
                panY = mouseY - (mouseY - panY) * (scale / prevScale);
                updateTransform();
            }, { passive: false });
        }

        function loadSavedState() {
            const saved = localStorage.getItem('theo_final_app_skills_sud_ia');
            if (saved) {
                const data = JSON.parse(saved);
                graphData.regions.forEach(r => {
                    r.nodes.forEach(n => {
                        if (data[n.id]) {
                            if (data[n.id].unlocked !== undefined) n.unlocked = data[n.id].unlocked;
                            if (data[n.id].link !== undefined) n.link = data[n.id].link;
                        }
                    });
                });
            }
        }

        function saveState() {
            const data = {};
            graphData.regions.forEach(r => {
                r.nodes.forEach(n => {
                    data[n.id] = { unlocked: n.unlocked, link: n.link };
                });
            });
            localStorage.setItem('theo_final_app_skills_sud_ia', JSON.stringify(data));
        }

        function isNodeUnlocked(id) {
            if (id === "CENTER") return true;
            for (let r of graphData.regions) {
                let found = r.nodes.find(n => n.id === id);
                if (found) return found.unlocked;
            }
            return false;
        }

        function initGraph() {
            const linesGroup = document.getElementById('svg-lines-group');
            const container = document.getElementById('nodes-container');
            linesGroup.innerHTML = ''; container.innerHTML = '';

            const cx = 5000; 
            const cy = 5000;

            nodePositions["CENTER"] = { x: cx, y: cy };

            const centerWrap = document.createElement('div');
            centerWrap.className = 'skill-node-wrapper';
            centerWrap.style.left = `${cx}px`; centerWrap.style.top = `${cy}px`;

            const centerEl = document.createElement('div');
            centerEl.className = 'skill-node center-node';
            centerEl.innerHTML = `<span class="node-icon">${graphData.center.icon}</span>`;
            centerWrap.appendChild(centerEl); 
            centerWrap.onclick = (e) => { e.stopPropagation(); openCenterModal(); };
            container.appendChild(centerWrap);

            let hudScores = { A: 0, B: 0, C: 0, D: 0 };

            graphData.regions.forEach(r => {
                r.nodes.forEach(n => {
                    nodePositions[n.id] = { x: cx + n.dx, y: cy + n.dy };
                });
            });

            graphData.regions.forEach(r => {
                let regionCount = 0;

                r.nodes.forEach(n => {
                    if (n.unlocked) regionCount++;
                    const pos = nodePositions[n.id];
                    const parentPos = nodePositions[n.parent];

                    if (parentPos && isNodeUnlocked(n.parent)) {
                        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                        line.setAttribute('x1', parentPos.x); line.setAttribute('y1', parentPos.y);
                        line.setAttribute('x2', pos.x); line.setAttribute('y2', pos.y);
                        line.setAttribute('class', `connection-line ${n.unlocked ? 'active-' + r.key.toLowerCase() : ''}`);
                        linesGroup.appendChild(line);
                    }

                    const nodeWrap = document.createElement('div');
                    nodeWrap.className = 'skill-node-wrapper';
                    nodeWrap.style.left = `${pos.x}px`; nodeWrap.style.top = `${pos.y}px`;

                    const nodeEl = document.createElement('div');
                    nodeEl.className = `skill-node ${n.unlocked ? 'unlocked-' + r.key.toLowerCase() : ''}`;
                    nodeEl.innerHTML = `
                        <span class="node-icon">${n.icon}</span>
                        ${n.unlocked ? `<span class="check-badge" style="color:${r.color}">✓</span>` : ''}
                    `;

                    const labelEl = document.createElement('div');
                    labelEl.className = 'node-title-label';
                    labelEl.innerText = n.label;

                    nodeWrap.appendChild(nodeEl); nodeWrap.appendChild(labelEl);
                    nodeWrap.onclick = (e) => { e.stopPropagation(); openModal(n, r); };

                    container.appendChild(nodeWrap);
                });

                hudScores[r.key] = regionCount;
            });

            document.getElementById('score-a').innerText = hudScores.A;
            document.getElementById('score-b').innerText = hudScores.B;
            document.getElementById('score-c').innerText = hudScores.C;
            document.getElementById('score-d').innerText = hudScores.D;
        }

        function openCenterModal() {
            const modal = document.getElementById('modal');
            const card = document.getElementById('modal-card');
            card.style.borderColor = "#f59e0b";
            document.getElementById('modal-title').innerText = `${graphData.center.icon} ${graphData.center.label}`;
            document.getElementById('modal-desc').innerText = graphData.center.desc;
            document.getElementById('modal-details').innerText = graphData.center.details;
            document.getElementById('node-link-input').parentElement.style.display = 'none';
            document.getElementById('modal-doc-link').style.display = 'none';
            document.getElementById('btn-toggle').style.display = 'none';
            modal.style.display = 'flex';
        }

        function openModal(node, region) {
            activeNode = node;
            const modal = document.getElementById('modal');
            const card = document.getElementById('modal-card');
            
            card.style.borderColor = region.color;
            document.getElementById('modal-title').innerText = `${node.icon} ${node.id} - ${node.label}`;
            document.getElementById('modal-desc').innerText = node.desc;
            document.getElementById('modal-details').innerText = node.details;

            document.getElementById('node-link-input').parentElement.style.display = 'block';
            document.getElementById('btn-toggle').style.display = 'block';

            const linkInput = document.getElementById('node-link-input');
            linkInput.value = node.link || "";

            updateDocButtonUI();
            updateModalUI(region);
            modal.style.display = 'flex';
        }

        function saveNodeLink() {
            if (activeNode) {
                const linkInput = document.getElementById('node-link-input');
                activeNode.link = linkInput.value.trim();
                saveState();
                updateDocButtonUI();
                alert("Lien enregistré avec succès !");
            }
        }

        function updateDocButtonUI() {
            const docLinkBtn = document.getElementById('modal-doc-link');
            if (activeNode && activeNode.link && activeNode.link !== "") {
                docLinkBtn.href = activeNode.link;
                docLinkBtn.style.display = "inline-block";
            } else {
                docLinkBtn.style.display = "none";
            }
        }

        function updateModalUI(region) {
            const badge = document.getElementById('modal-badge');
            const btn = document.getElementById('btn-toggle');
            
            if (activeNode.unlocked) {
                badge.style.background = region.color;
                badge.style.color = "#fff";
                badge.innerText = "STATUT : MAÎTRISÉ (DÉBLOQUÉ)";
                btn.innerText = "Verrouiller (Remettre à zéro)";
                btn.style.background = "#ef4444";
                btn.style.color = "#fff";
            } else {
                badge.style.background = "#334155";
                badge.style.color = "#aaa";
                badge.innerText = "STATUT : À DÉBLOQUER";
                btn.innerText = "Marquer comme maîtrisé (Débloquer)";
                btn.style.background = "#10b981";
                btn.style.color = "#fff";
            }
        }

        function toggleSkill() {
            if (activeNode) {
                activeNode.unlocked = !activeNode.unlocked;
                saveState();
                initGraph();
                closeModal();
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        loadSavedState();
        initGalaxy();
        initGraph();
        buildSidebarMenu();
        
        scale = 0.20;
        panX = (window.innerWidth / 2) - (5000 * scale);
        panY = (window.innerHeight / 2) - (5000 * scale);
        updateTransform();

        setupPanAndZoom();
    </script>
</body>
